name: End-to-end tests
on: push
jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false # Skip installation as we've already done it
          build: npm run build
          start: npm run test:mode
        env:
          CYPRESS_TOKEN: ${{ secrets.CYPRESS_TOKEN }}
          CYPRESS_REFRESH_TOKEN: ${{ secrets.CYPRESS_REFRESH_TOKEN }}}
          CYPRESS_REACT_APP_TEST_EMAIL: ${{ secrets.CYPRESS_REACT_APP_TEST_EMAIL }}
          CYPRESS_REACT_APP_TEST_PASSWORD: ${{ secrets.CYPRESS_REACT_APP_TEST_PASSWORD }}
          CYPRESS_REACT_APP_TEST_API_URL: ${{ secrets.CYPRESS_REACT_APP_TEST_API_URL }}
          CYPRESS_REACT_APP_BASE_URL: ${{ secrets.CYPRESS_REACT_APP_BASE_URL }}
