name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "**/README.md"
      - "frontend/src/assets/appImages/**"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "**/README.md"
      - "frontend/src/assets/appImages/**"
      - "docs/**"
      - ".gitignore"

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    name: Build and test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run test:mode
          wait-on: "http://localhost:3000"
          browser: chrome
          headed: false
          config: video=true,screenshotOnRunFailure=true
          record: false
        env:
          # Cypress environment variables
          CYPRESS_DISABLE_DEVICE_FRAME: true
          CYPRESS_DEBUG: true
          DEBUG: cypress:*

          # Backend environment variables
          TOKEN: ${{ secrets.TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TOKEN_EXPIRY: ${{ secrets.TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY }}

          # Frontend environment variables
          REACT_APP_API_URL: ${{ secrets.APP_API_URL }}
          REACT_APP_BASE_URL: ${{ secrets.BASE_URL }}

          REACT_APP_TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          REACT_APP_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          REACT_APP_TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          REACT_APP_TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

          REACT_APP_CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          REACT_APP_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          REACT_APP_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

  deploy-backend:
    needs: cypress-run
    if: success()
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Deploy Backend to Render
        uses: JorgeLNJunior/render-deploy@v1.4.5
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_deployment: true
          deployment_environment: "production"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          wait_deploy: true

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Deploy Frontend to Render
        uses: JorgeLNJunior/render-deploy@v1.4.5
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          github_deployment: true
          deployment_environment: "production"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          wait_deploy: false
