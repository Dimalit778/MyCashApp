name: Test and Deploy
on: push

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    name: Build and test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run test:mode
          wait-on: "http://localhost:3000"
        env:
          # Backend environment variables
          TOKEN: ${{ secrets.TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TOKEN_EXPIRY: ${{ secrets.TOKEN_EXPIRY }}
          REFRESH_TOKEN_EXPIRY: ${{ secrets.REFRESH_TOKEN_EXPIRY }}

          # Frontend environment variables
          REACT_APP_TEST_API_URL: ${{ secrets.TEST_API_URL }}
          REACT_APP_BASE_URL: ${{ secrets.BASE_URL }}
          REACT_APP_CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          REACT_APP_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          REACT_APP_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

deploy-backend:
  needs: cypress-run
  if: success()
  runs-on: ubuntu-latest
  steps:
    - name: Deploy Backend to Render
      uses: JorgeLNJunior/render-deploy@v1.4.5
      with:
        service_id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        api_key: ${{ secrets.RENDER_API_KEY }}
        github_deployment: true
        deployment_environment: "production"
        github_token: ${{ secrets.GITHUB_TOKEN }}
        wait_deploy: true

deploy-frontend:
  needs: deploy-backend
  runs-on: ubuntu-latest
  steps:
    - name: Deploy Frontend to Render
      uses: JorgeLNJunior/render-deploy@v1.4.5
      with:
        service_id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        api_key: ${{ secrets.RENDER_API_KEY }}
        github_deployment: true
        deployment_environment: "production"
        github_token: ${{ secrets.GITHUB_TOKEN }}
        wait_deploy: false
