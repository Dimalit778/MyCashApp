name: End-to-end tests
on: push
jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    name: Build and test
    env:
      CYPRESS_REACT_APP_TEST_API_URL: http://localhost:5001
      CYPRESS_REACT_APP_BASE_URL: http://localhost:3000
      CYPRESS_TOKEN: ${{ secrets.CYPRESS_TOKEN }}
      CYPRESS_ REFRESH_TOKEN: ${{ secrets.CYPRESS_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run test:mode
          wait-on: "http://localhost:3000"
